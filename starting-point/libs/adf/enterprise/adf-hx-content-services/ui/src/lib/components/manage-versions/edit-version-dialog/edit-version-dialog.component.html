<div class="hxp-edit-version-dialog">
    <h2 mat-dialog-title>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.TITLE' | translate }}</h2>
    <mat-dialog-content>
        <form [formGroup]="form" class="hxp-manage-versions-dialog-form">
            <div class="hxp-manage-versions-dialog-input-area">
                <div class="hxp-manage-versions-dialog-input-title">
                    <mat-label>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.FIELD_TITLE' | translate }}</mat-label>
                </div>
                <div class="hxp-input-area">
                    <mat-form-field class="hxp-edit-form-field">
                        <input matInput data-automation-id="title-field" formControlName="sysver_title" (keydown)="$event.stopPropagation()" />
                    </mat-form-field>
                </div>
            </div>
            <div class="hxp-manage-versions-dialog-input-area">
                <div class="hxp-manage-versions-dialog-input-title">
                    <mat-label>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.DESCRIPTION' | translate }}</mat-label>
                </div>
                <div class="hxp-input-area">
                    <mat-form-field class="hxp-edit-form-field" hideRequiredMarker>
                        <textarea
                            matInput
                            formControlName="sysver_description"
                            placeholder="{{ 'MANAGE_VERSIONS.EDIT_DIALOG.PLACEHOLDER_DESCRIPTION' | translate }}"
                            data-automation-id="description-field"
                            (keydown)="$event.stopPropagation()"
                        >
                        </textarea>
                    </mat-form-field>
                </div>
            </div>
        </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end" class="hxp-edit-version-dialog-footer-action">
        <button mat-button mat-dialog-close>{{ 'MANAGE_VERSIONS.EDIT_DIALOG.BUTTONS.CANCEL' | translate }}</button>
        <button mat-button class="hxp-primary-button" [disabled]="form.invalid || isUpdating" [ngClass]="{'hxp-loading': isUpdating}" (click)="save()">
            <span class="hxp-manage-version-dialog-save-btn-label">
                <mat-progress-spinner *ngIf="isUpdating" mode="indeterminate" diameter="15" />
                <span class="hxp-manage-version-dialog-save-btn-title">
                    {{ 'MANAGE_VERSIONS.EDIT_DIALOG.BUTTONS.SAVE' | translate }}
                </span>
            </span>
        </button>
    </mat-dialog-actions>
</div>
