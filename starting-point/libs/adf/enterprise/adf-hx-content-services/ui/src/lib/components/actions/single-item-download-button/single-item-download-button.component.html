<button
    *ngIf="isAvailable"
    id="document-viewer-single-download-button"
    mat-icon-button
    [attr.aria-label]="'SINGLE_FILE_DOWNLOAD.TOOLBAR.BUTTONS.DOWNLOAD.ARIA-LABEL' | translate"
    title="{{ 'SINGLE_FILE_DOWNLOAD.TOOLBAR.BUTTONS.DOWNLOAD.TITLE' | translate }}"
    [matTooltip]="'SINGLE_FILE_DOWNLOAD.TOOLBAR.BUTTONS.DOWNLOAD.TITLE' | translate"
    (click)="onDownload()"
    >
        <mat-icon>download</mat-icon>
</button>
