<adf-info-drawer-layout>
    <div info-drawer-content>
        <div class="hxp-property-panel-header">
            <div class="hxp-property-panel-header_title mat-h1">{{ selectedDocument?.sys_title }}</div>
            <button
                mat-icon-button
                attr.aria-label="{{ 'DOCUMENT.PROPERTIES.RIGHT_SIDEBAR.CLOSE' | translate }}"
                (click)="onClose()"
                class="hxp-property-sidebar-close-button"
            >
                <mat-icon>close</mat-icon>
            </button>
        </div>
        <adf-info-drawer>
            <adf-info-drawer-tab label="Properties">
                <div *ngIf="propertyLoading" class="hxp-property-panel-spinner-container">
                    <mat-progress-spinner
                        mode="indeterminate"
                        diameter="30" />
                </div>

                <ng-container *ngIf="!propertyLoading && (documentProperties$ | async) as documentProperties">
                    <hxp-properties-viewer-container
                        [expanded]="true"
                        [useChipsForMultiValueProperty]="false"
                        [properties]="documentProperties"
                        headerText="DOCUMENT.PROPERTIES.VIEWER.MAIN.CONTAINER.HEADER"
                        id="properties-viewer-container"
                        [editable]="editable"
                        [document]="selectedDocument"
                        (propertyUpdateRequest)="handlePropertyUpdate($event)" />
                </ng-container>

                <ng-container *ngIf="!propertyLoading && (otherDocumentProperties$ | async) as otherProperties">
                    <hxp-properties-viewer-container
                        *ngIf="otherProperties.length > 0"
                        [expanded]="false"
                        [useChipsForMultiValueProperty]="true"
                        [displayLabelForChips]="true"
                        [properties]="otherProperties"
                        headerText="DOCUMENT.PROPERTIES.VIEWER.OTHER.CONTAINER.HEADER"
                        id="properties-viewer-container"
                        [editable]="editable"
                        [document]="selectedDocument"
                        (propertyUpdateRequest)="handlePropertyUpdate($event)" />
                </ng-container>
            </adf-info-drawer-tab>
        </adf-info-drawer>
    </div>
</adf-info-drawer-layout>
