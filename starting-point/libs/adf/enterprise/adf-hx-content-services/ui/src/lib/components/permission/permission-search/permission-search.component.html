<div class="hxp-permission-dialog-search-holder">
    <input
        id="hxp-permission-user-search"
        class="hxp-permission-dialog-search"
        matInput
        placeholder="{{ placeHolder }}"
        type="text"
        [matAutocomplete]="auto"
        (keyup)="onKey($event)"
    />

    <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
        <mat-option
            *ngFor="let option of activePermissionsManagementRows;
            trackBy: permissionsManagementRowTrackBy"
            [value]="option.entityLabel"
            (click)="emit(option.entityLabel)"
        >
            {{ option.entityLabel }}
        </mat-option>
    </mat-autocomplete>

    <div class="hxp-search-permission-dialog-divider">
        <mat-icon matSuffix>search</mat-icon>
    </div>
</div>
