<hxp-search-filter-container
    #searchFilter
    [name]="'SEARCH.FILTERS.DOCUMENT_CATEGORY.LABEL' | translate"
    [selectedValue]="selectedValue"
    (filterApplied)="applyFilter()"
    (filterCleared)="clearFilter()"
    (overlayClosed)="overlayClosed()"
    [filterForm]="filterForm"
>
    <div class="hxp-document-category-filter-container">
        <hxp-search-filter-input
            [inputAriaLabel]="'SEARCH.FILTERS.DOCUMENT_CATEGORY.LABEL' | translate"
            [placeholder]="'SEARCH.FILTERS.DOCUMENT_CATEGORY.PLACEHOLDER' | translate"
            [clearAriaLabel]="'SEARCH.FILTERS.DOCUMENT_CATEGORY.ARIA-LABEL.CLEAR_INPUT' | translate"
            (search)="filteredSearch($event)"
            (clear)="clearInput()"
        />

        <div class="hxp-document-category-filter-summary">
            <mat-chip-set
                class="hxp-document-category-filter-summary-list"
                tabindex="0"
            >
                <span class="hxp-document-category-filter-summary-list-prefix">
                    {{
                        'SEARCH.FILTERS.DOCUMENT_CATEGORY.SELECTED'
                            | translate: { selected: selection.selected.length }
                    }}<span *ngIf="selection.selected.length > 0" class="hxp-document-category-filter-summary-list-colon">:</span>
                </span>
                <mat-chip
                    *ngFor="let selectedCategory of selection.selected"
                    class="hxp-document-category-filter-summary-list-item"
                    [attr.aria-label]="selectedCategory"
                >
                    <span class="hxp-document-category-filter-summary-list-item__label">{{ selectedCategory }}</span>
                    <button
                        matChipRemove
                        [attr.aria-label]="
                            ('SEARCH.FILTERS.DOCUMENT_CATEGORY.ARIA-LABEL.REMOVE'
                                | translate) +
                            ' ' +
                            selectedCategory
                        "
                        (click)="onDeselect(selectedCategory)"
                    >
                        <mat-icon
                            class="hxp-document-category-filter-summary-list-remove-item-icon"
                            svgIcon="search_clear"
                            aria-hidden="true"
                        />
                    </button>
                </mat-chip>
            </mat-chip-set>
        </div>

        <div
            *ngIf="isLoading"
            class="hxp-document-category-filter-spinner-container"
        >
            <mat-progress-spinner mode="indeterminate" />
        </div>

        <ng-container *ngIf="!isLoading">
            <mat-selection-list
                #documentCategories
                class="hxp-document-category-filter-list"
                (selectionChange)="onSelectionListChange($event)"
                *ngIf="filteredCategories.length; else noResults"
                [attr.aria-label]="
                    'SEARCH.FILTERS.DOCUMENT_CATEGORY.ARIA-LABEL.DOCUMENT_CATEGORIES_LIST'
                        | translate
                "
            >
                <mat-list-option
                    *ngFor="let category of filteredCategories"
                    [value]="category"
                    class="hxp-document-category-filter-list-option"
                    checkboxPosition="before"
                    [selected]="isChecked(category)"
                    [attr.aria-label]="category"
                >
                    <span>{{ category }}</span>
                </mat-list-option>
            </mat-selection-list>

            <ng-template #noResults>
                <div class="hxp-document-category-filter-no-results">
                    <h2>
                        {{
                            'SEARCH.FILTERS.DOCUMENT_CATEGORY.NO_SEARCH_RESULTS.TITLE'
                                | translate
                        }}
                    </h2>
                    <p>
                        {{
                            'SEARCH.FILTERS.DOCUMENT_CATEGORY.NO_SEARCH_RESULTS.MESSAGE'
                                | translate
                        }}
                    </p>
                </div>
            </ng-template>
        </ng-container>
    </div>
</hxp-search-filter-container>
