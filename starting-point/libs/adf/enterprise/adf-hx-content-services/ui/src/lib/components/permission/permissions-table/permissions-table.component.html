<ng-content select="[permission-search]" />

<div id="who-access" class="hxp-permission-dialog-who">
    {{ title | translate }}
</div>

<div class="hxp-user-table">
    <table
        *ngIf="activePermissionsManagementRows.length > 0 else emptyTable"
        mat-table
        [dataSource]="activePermissionsManagementRows"
        class="hxp-permission-dialog-list mat-elevation-z0"
        aria-describedby="who-access"
    >
        <ng-container matColumnDef="permissionEntity">
            <th mat-header-cell *matHeaderCellDef>
                <ng-template *ngTemplateOutlet="entityColumnHeaderTemplateRef" />
            </th>
            <td mat-cell *matCellDef="let element">

                <ng-template #defaultUserGroupCell let-element>
                    {{ element.entityLabel }}
                </ng-template>

                <ng-container
                    *ngTemplateOutlet="entityCellTemplateRef || defaultUserGroupCell; context: { $implicit: element }" />

            </td>
        </ng-container>
        <ng-container matColumnDef="inheritedPermission">
            <th mat-header-cell *matHeaderCellDef>
                <ng-template *ngTemplateOutlet="inheritedPermissionColumnHeaderTemplateRef" />
            </th>
            <td mat-cell *matCellDef="let element">

                <ng-container
                    *ngTemplateOutlet="inheritedPermissionCellTemplateRef; context: { $implicit: element }" />

            </td>
        </ng-container>
        <ng-container matColumnDef="permission">
            <th mat-header-cell *matHeaderCellDef>
                <ng-template *ngTemplateOutlet="fileColumnHeaderTemplateRef" />
            </th>
            <td mat-cell *matCellDef="let element">

                <ng-template #defaultPermissionCell let-element>
                    {{ element.permission }}
                </ng-template>

                <ng-container
                    *ngTemplateOutlet="fileCellTemplateRef || defaultPermissionCell; context: { $implicit: element }" />

            </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hxp-permission-row"></tr>
    </table>
</div>

<ng-template #defaultEmptyTable>
    <div class="hxp-no-permission">
        {{ 'PERMISSIONS_MANAGEMENT_ACTION.PERMISSIONS_TABLE.NO_PERMISSION.DEFAULT' | translate }}
    </div>
</ng-template>

<ng-template #emptyTable>
    <ng-template *ngTemplateOutlet="emptyTableTemplateRef || defaultEmptyTable" />
</ng-template>
