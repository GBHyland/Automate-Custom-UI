<sat-app-header class="hxp-header">
    <div
        satAppHeaderTitle
        role="link"
        [attr.aria-label]="headerConfig.title | translate"
        routerLink="/"
        class="hxp-header-app-title mat-h1"
    >
        {{ headerConfig.title | translate }}
    </div>

    @if(logoPath) {
        <img
            satAppHeaderLogo
            [src]="logoPath"
            [attr.alt]="'HEADER.LOGO' | translate"
            class="hxp-header-custom-logo"
        />
    } @else {
        <div
            satAppHeaderLogo
            class="hxp-header-app-logo"
        >
            <sat-word-mark-logo />
        </div>
    }

    <div satAppHeaderActions>
        <button
            mat-icon-button
            [matMenuTriggerFor]="menu"
            [attr.aria-label]="'HEADER.SETTINGS' | translate"
            data-automation-id="hxp-header-menu-button"
        >
            <mat-icon svgIcon="gear_24px" />
        </button>
        <mat-menu #menu="matMenu">
            <hxp-language-action />
            <hxp-feature-flags-action />
            <hxp-help-action />
        </mat-menu>
    </div>
</sat-app-header>
