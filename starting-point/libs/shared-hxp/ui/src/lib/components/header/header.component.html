@if(featuresService.isOn$(applicationChromeFeatureFlag) | async) {
    <hxp-header
        [ngStyle]="{
            '--hxp-header-bg': (backgroundColor$ | async) ?? '',
            '--hxp-header-bg-image': (backgroundImage$ | async) ? 'url(' + (backgroundImage$ | async) + ')' : 'none',
            '--hxp-header-text-color' : (headerTextColor$ | async) ?? ''
        }"
        [logoPath]="(logoPath$ | async) ?? undefined"
    />
} @else {
    <adf-layout-header
        [title]="(title$ | async) ?? ''"
        [color]="(backgroundColor$ | async) ?? ''"
        [backgroundImage]="(backgroundImage$ | async) ?? ''"
        [redirectUrl]="landingPage"
        [expandedSidenav]="expandedSidenav"
        [class.hxp-custom-header-color]="(headerTextColor$ | async) ?? ''"
        [showSidenavToggle]="showSidenavToggle"
        [showLogo]="false"
        (clicked)="toggleMenu()"
    >
        <div class="adf-toolbar--spacer adf-toolbar-divider"></div>
        @if (logoPath$ | async) {
            <div class="hxp-header-logo">
                <img [src]="(logoPath$ | async) ?? ''" alt="Hyland logo">
            </div>
        } @else {
            <sat-logo class="hxp-sat-header-logo">
                <sat-word-mark-logo />
            </sat-logo>
        }

        <hxp-app-user-info [showName]="false" />

        <hxp-more-menu />
    </adf-layout-header>
    <mat-divider />
}
