<div mat-dialog-title>{{ 'GOVERNANCE.DELETE_DIALOG.TITLE' | translate }}</div>

<mat-dialog-content class="hxp-cic-gov-record-dialog-content">
    <p>{{ 'GOVERNANCE.DELETE_DIALOG.CONTENT' | translate }}</p>
</mat-dialog-content>

<mat-dialog-actions class="hxp-cic-gov-record-dialog-actions" align="end">
    <button mat-button (click)="onCancel()" [disabled]="isDeleting">
        {{ 'GOVERNANCE.DELETE_DIALOG.CANCEL' | translate }}
    </button>

    <button mat-flat-button color="warn" [disabled]="isDeleting" [ngClass]="{ 'hxp-loading': isDeleting }" (click)="onConfirm()">
        <span class="hxp-record-delete-btn-label">
            <mat-progress-spinner *ngIf="isDeleting" mode="indeterminate" diameter="15" strokeWidth="3" />
            <span class="hxp-record-delete-btn-title">
                {{ 'GOVERNANCE.DELETE_DIALOG.DELETE' | translate }}
            </span>
        </span>
    </button>
</mat-dialog-actions>
