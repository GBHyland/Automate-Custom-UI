<hxp-governance-search-filter-container #searchFilter [name]="'GOVERNANCE.SEARCH_FILTERS.RECORD_NAME.LABEL' | translate"
    [selectedValue]="selectedValue" [filterForm]="filterForm" (filterApplied)="applyFilter()"
    (filterCleared)="clearFilter()" (overlayClosed)="overlayClosed()" class="hxp-governance-record-name-search-filter"
    id="recordName">
    <div class="hxp-governance-record-name-search-filter-container">
        <mat-form-field appearance="outline" class="hxp-governance-record-name-search-filter-input">
            <mat-label>{{ 'GOVERNANCE.SEARCH_FILTERS.RECORD_NAME.LABEL' | translate }}</mat-label>
            <input type="text" [placeholder]="'GOVERNANCE.SEARCH_FILTERS.RECORD_NAME.PLACEHOLDER' | translate" matInput
                [value]="inputValue" (input)="onInputChange($event)" (keyup.esc)="clearFilter()" />
        </mat-form-field>
        @if (!isValid && inputValue.length > 0) {
            <mat-error class="hxp-governance-record-name-search-filter-error">
                {{ 'GOVERNANCE.SEARCH_FILTERS.RECORD_NAME.ERROR' | translate }}
            </mat-error>
        }
    </div>
</hxp-governance-search-filter-container>
