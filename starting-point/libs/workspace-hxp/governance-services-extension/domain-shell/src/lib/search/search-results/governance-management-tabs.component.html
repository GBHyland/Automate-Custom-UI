<div class="hxp-governance-management-container">

  <div class="hxp-governance-main-column">
    <div class="hxp-governance-management-header-title">
      {{ 'GOVERNANCE.HEADER.TITLE' | translate }}
    </div>

    <mat-tab-group mat-align-tabs="start" mat-stretch-tabs="false" animationDuration="0"
    class="hxp-governance-management-tab-group" (selectedTabChange)="onTabChanged()">
      <mat-tab label="{{ 'GOVERNANCE.TABS.RECORDS' | translate }}">
        <ng-template matTabContent>
          <hxp-governance-search-results
            (sidebarToggle)="onSidebarToggle($event)"
            (actionContextChange)="onActionContextChange($event)"
            (selectedRecordsChange)="onSelectedRecordsChange($event)"
          />
        </ng-template>
      </mat-tab>

      @if(isLegalHoldFeatureFlagOn) {
      <mat-tab label="{{ 'GOVERNANCE.TABS.LEGAL_HOLD' | translate }}">
        <ng-template matTabContent>
          <hxp-governance-legal-hold #legalHold />
        </ng-template>
      </mat-tab>
      }
    </mat-tab-group>
  </div>
  @if (activeTabIndex === 0 && showSidebar && selectedRecords.length > 0) {
    <div class="hxp-governance-results-sidebar">
      <hxp-record-properties-sidebar [actionContext]="actionContext" />
    </div>
  }
</div>
