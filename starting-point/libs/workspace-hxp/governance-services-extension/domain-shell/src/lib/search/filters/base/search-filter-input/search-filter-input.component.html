<mat-form-field
    class="hxp-governance-search-filter-input hxp-input"
    appearance="outline"
>
    <div
        *ngIf="prefixIcon"
        matPrefix
        class="hxp-governance-search-filter-input-prefix"
    >
        <button
            mat-icon-button
            type="button"
            [attr.aria-label]="prefixAriaLabel"
            (click)="onPrefixClick()"
        >
            <mat-icon
                aria-hidden="true"
                [svgIcon]="prefixIcon"
            />
        </button>
        <mat-divider
            vertical
            class="hxp-governance-search-filter-input-divider"
        />
    </div>
    <input
        matInput
        type="text"
        [attr.aria-label]="inputAriaLabel"
        [placeholder]="placeholder ?? ''"
        [(ngModel)]="searchTerm"
        (keyup)="applyFilter($event)"
    >
    <div matSuffix class="hxp-governance-search-filter-input-suffix">
        @if (searchTerm) {
            <button
                mat-icon-button
                class="hxp-governance-search-filter-input-clear"
                [attr.aria-label]="clearAriaLabel"
                (click)="clearInput()"
            >
                <mat-icon class="hxp-governance-search-filter-input-clear-icon">
                    close
                </mat-icon>
            </button>
        } @else {
            <mat-icon
                class="hxp-governance-search-filter-input-search-icon"
                svgIcon="search_glass"
            />
        }
    </div>
</mat-form-field>
