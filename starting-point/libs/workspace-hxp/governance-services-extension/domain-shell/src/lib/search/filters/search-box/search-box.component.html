<mat-form-field appearance="outline" class="hxp-search-field">
    <mat-icon matPrefix>search</mat-icon>
    <input
        matInput
        [attr.aria-label]="'GOVERNANCE.SEARCH_INPUT.SEARCH' | translate"
        [placeholder]="placeholder"
        [(ngModel)]="searchText"
        (keydown)="onKeyDown($event)"
        (input)="onInputChange()"
        [disabled]="disabled"
    />
    <button
        *ngIf="searchText"
        matSuffix
        mat-icon-button
        [attr.aria-label]="'GOVERNANCE.SEARCH_INPUT.CLEAR' | translate"
        (click)="clearSearch()"
        class="hxp-icon-like-button hxp-search-field-close"
        [disabled]="disabled"
    >
        <mat-icon>close</mat-icon>
    </button>
</mat-form-field>
