<div class="hxp-record-list-container">
    <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8 full-width-table hxp-record-list-header">
        <!-- Select Column -->
        <ng-container matColumnDef="select">
            <th mat-header-cell *matHeaderCellDef [style.width]="'1%'">
                @if (selectAllEnabled) {
                    <mat-checkbox (change)="$event ? toggleAllRowsSelection() : null"
                        [checked]="isAllSelected()"
                        [indeterminate]="selection.hasValue() && !isAllSelected()" />
                }
            </th>
            <td mat-cell *matCellDef="let row" [style.width]="'1%'">
                <mat-checkbox (click)="$event.stopPropagation()"
                            (change)="toggleRowSelection(row)"
                            [checked]="selection.isSelected(row)" />
            </td>
        </ng-container>

        <!-- Dynamic Projected Columns -->
        @for (column of projectedColumns; track column.key) {
            <ng-container matColumnDef="{{ column.key }}">
                <th mat-header-cell *matHeaderCellDef [style.width]="column.width">
                    @if (column.sortable) {
                        <div mat-sort-header>{{ column.title | translate }}</div>
                    } @else {
                        {{ column.title | translate }}
                    }
                </th>

                <td mat-cell *matCellDef="let row" [style.width]="column.width">
                    @if (column.template) {
                        <ng-container *ngTemplateOutlet="column.template; context: { $implicit: row, row: row }" />
                    } @else {
                        {{ row[column.key] }}
                    }
                </td>
            </ng-container>
        }

        <!-- Table Row Definitions -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="hxp-record-list-header"></tr>
        <tr class="hxp-record-list-row"
            mat-row
            *matRowDef="let row; columns: displayedColumns;"
            (click)="toggleRowSelection(row)"
            [class.hxp-record-selected]="selection.isSelected(row)">
        </tr>

        <!-- Empty state row: shown only if no records -->
        <!-- TODO - we need to check the mockups for this state -->
        <div mat-row *matNoDataRow><div mat-cell >No data</div></div>
    </table>
</div>
